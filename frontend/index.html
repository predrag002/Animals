<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Animals-10 Klasifikator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }
    header p {
      color: #94a3b8;
      margin-top: 6px;
      font-size: 0.95rem;
    }

    .card {
      background: #1e2130;
      border: 1px solid #2d3348;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    
    .upload-zone {
      border: 2px dashed #3d4663;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: #6366f1;
      background: rgba(99,102,241,0.07);
    }
    .upload-zone input[type="file"] {
      position: absolute; inset: 0;
      opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .upload-icon { font-size: 2.5rem; margin-bottom: 10px; }
    .upload-zone p { color: #94a3b8; font-size: 0.9rem; }
    .upload-zone span { color: #6366f1; font-weight: 600; }

    
    #preview-wrap {
      display: none;
      margin-top: 20px;
      text-align: center;
    }
    #preview-img {
      max-height: 260px;
      max-width: 100%;
      border-radius: 10px;
      border: 1px solid #2d3348;
      object-fit: contain;
    }
    .remove-btn {
      display: inline-block;
      margin-top: 10px;
      color: #ef4444;
      font-size: 0.82rem;
      cursor: pointer;
      background: none;
      border: none;
      text-decoration: underline;
    }

    
    #predict-btn {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #6366f1;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }
    #predict-btn:hover:not(:disabled) { background: #4f46e5; }
    #predict-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    
    .loader {
      display: none;
      justify-content: center;
      margin-top: 24px;
      gap: 8px;
    }
    .loader.show { display: flex; }
    .dot {
      width: 10px; height: 10px;
      background: #6366f1;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%           { transform: scale(1.0); opacity: 1;   }
    }

    
    #results {
      display: none;
      margin-top: 24px;
    }
    .result-header {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #252a3d;
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }
    .result-emoji { font-size: 2.6rem; }
    .result-label { font-size: 1.5rem; font-weight: 700; color: #fff; text-transform: capitalize; }
    .result-conf  { color: #94a3b8; font-size: 0.85rem; margin-top: 2px; }

    .top3-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 10px;
    }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .bar-label {
      width: 90px;
      font-size: 0.88rem;
      text-transform: capitalize;
      color: #cbd5e1;
      flex-shrink: 0;
    }
    .bar-track {
      flex: 1;
      background: #2d3348;
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: #6366f1;
      transition: width 0.6s ease;
    }
    .bar-fill.second { background: #8b5cf6; }
    .bar-fill.third  { background: #a78bfa; }
    .bar-pct {
      width: 42px;
      text-align: right;
      font-size: 0.82rem;
      color: #94a3b8;
    }

    .model-badge {
      margin-top: 18px;
      font-size: 0.78rem;
      color: #475569;
      text-align: center;
    }

    
    #error-box {
      display: none;
      margin-top: 16px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      padding: 14px 16px;
      color: #fca5a5;
      font-size: 0.88rem;
    }

    footer {
      margin-top: 40px;
      color: #334155;
      font-size: 0.78rem;
    }
  </style>
</head>
<body>

<header>
  <h1>🐾 Animals-10 Klasifikator</h1>
  <p>Ubaci sliku životinje — CNN model predviđa klasu</p>
</header>

<div class="card">
  
  <div class="upload-zone" id="drop-zone">
    <input type="file" id="file-input" accept="image/*"/>
    <div class="upload-icon">📂</div>
    <p><span>Klikni da odabereš</span> ili prevuci sliku ovde</p>
    <p style="margin-top:6px;font-size:0.78rem">JPG, PNG, WEBP</p>
  </div>

  
  <div id="preview-wrap">
    <img id="preview-img" alt="preview"/>
    <br/>
    <button class="remove-btn" onclick="resetAll()">✕ Ukloni sliku</button>
  </div>

  
  <button id="predict-btn" disabled onclick="predict()">
    Predvidi klasu
  </button>


  <div class="loader" id="loader">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  
  <div id="error-box"></div>

  
  <div id="results">
    <div class="result-header">
      <div class="result-emoji" id="res-emoji"></div>
      <div>
        <div class="result-label" id="res-label"></div>
        <div class="result-conf"  id="res-conf"></div>
      </div>
    </div>
    <div class="top3-title">Top 3 predikcije</div>
    <div id="bars"></div>
    <div class="model-badge" id="model-badge"></div>
  </div>
</div>

<footer>Animals-10 CNN · Veštačka inteligencija sa primenama</footer>

<script>
  const EMOJIS = {
    butterfly: '🦋', cat: '🐱', chicken: '🐔', cow: '🐄',
    dog: '🐶', elephant: '🐘', horse: '🐴', sheep: '🐑',
    spider: '🕷️', squirrel: '🐿️',
  };

  const SRPSKI = {
    butterfly: 'Leptir', cat: 'Mačka', chicken: 'Kokoška', cow: 'Krava',
    dog: 'Pas', elephant: 'Slon', horse: 'Konj', sheep: 'Ovca',
    spider: 'Pauk', squirrel: 'Veverica',
  };

  let selectedFile = null;

  const fileInput  = document.getElementById('file-input');
  const dropZone   = document.getElementById('drop-zone');
  const previewWrap= document.getElementById('preview-wrap');
  const previewImg = document.getElementById('preview-img');
  const predictBtn = document.getElementById('predict-btn');
  const loader     = document.getElementById('loader');
  const results    = document.getElementById('results');
  const errorBox   = document.getElementById('error-box');

  
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) setFile(file);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) setFile(fileInput.files[0]);
  });

  function setFile(file) {
    selectedFile = file;
    const url = URL.createObjectURL(file);
    previewImg.src = url;
    previewWrap.style.display = 'block';
    dropZone.style.display    = 'none';
    predictBtn.disabled       = false;
    results.style.display     = 'none';
    errorBox.style.display    = 'none';
  }

  function resetAll() {
    selectedFile              = null;
    fileInput.value           = '';
    previewWrap.style.display = 'none';
    dropZone.style.display    = 'block';
    predictBtn.disabled       = true;
    results.style.display     = 'none';
    errorBox.style.display    = 'none';
    loader.classList.remove('show');
  }

  async function predict() {
    if (!selectedFile) return;

    loader.classList.add('show');
    predictBtn.disabled    = true;
    results.style.display  = 'none';
    errorBox.style.display = 'none';

    const formData = new FormData();
    formData.append('file', selectedFile);

    try {
      const resp = await fetch('/predict', { method: 'POST', body: formData });
      const data = await resp.json();

      if (!resp.ok) {
        throw new Error(data.detail || 'Greška servera');
      }

      showResults(data);
    } catch (err) {
      errorBox.textContent   = '⚠️ ' + err.message;
      errorBox.style.display = 'block';
    } finally {
      loader.classList.remove('show');
      predictBtn.disabled = false;
    }
  }

  function showResults(data) {
    const pred  = data.prediction;
    const conf  = (data.confidence * 100).toFixed(1);
    const top3  = data.top3;
    const model = data.model_used;

    document.getElementById('res-emoji').textContent = EMOJIS[pred] || '🐾';
    document.getElementById('res-label').textContent =
      (SRPSKI[pred] || pred) + ' (' + pred + ')';
    document.getElementById('res-conf').textContent  =
      `Pouzdanost: ${conf}%`;
    document.getElementById('model-badge').textContent =
      `Model: ${model}`;

    const barsDiv = document.getElementById('bars');
    barsDiv.innerHTML = '';
    const fillClasses = ['', 'second', 'third'];

    top3.forEach((item, i) => {
      const pct = (item.confidence * 100).toFixed(1);
      barsDiv.innerHTML += `
        <div class="bar-row">
          <div class="bar-label">${SRPSKI[item.class] || item.class}</div>
          <div class="bar-track">
            <div class="bar-fill ${fillClasses[i]}" style="width:${pct}%"></div>
          </div>
          <div class="bar-pct">${pct}%</div>
        </div>`;
    });

    results.style.display = 'block';
  }
</script>
</body>
</html>
